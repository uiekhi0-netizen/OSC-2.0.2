name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -o *.zip
      - run: mvn -B -f OrbitalPlugin/pom.xml clean package
      - run: ls -la OrbitalPlugin/target
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-jar2.1
          path: OrbitalPlugin/target/*.jar
          if-no-files-found: error
